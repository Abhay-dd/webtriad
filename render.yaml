services:
  # ── Backend Web Service (serves both API and built React frontend) ──────────
  - type: web
    name: triad-realty
    runtime: python
    # Root directory is the backend folder; Python imports resolve from here.
    # The buildCommand navigates up to build the React app first.
    rootDir: backend
    buildCommand: |
      cd ../frontend && npm install --legacy-peer-deps && GENERATE_SOURCEMAP=false npm run build && cp -r build ../backend/frontend_build && cd ../backend && pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free

    envVars:
      # ── Runtime ────────────────────────────────────────────────────────────────
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PORT
        value: "10000"

      # ── Environment flag (activates JWT secret enforcement) ───────────────────
      - key: ENVIRONMENT
        value: production
      - key: FORCE_HTTPS
        value: "true"
      - key: LOG_FORMAT
        value: json

      # ── Frontend API URL injected at build time ────────────────────────────────
      # Empty string → relative path /api/... (backend serves the frontend)
      - key: REACT_APP_BACKEND_URL
        value: ""

      # ── Auth — set these in Render Dashboard → Environment ────────────────────
      - key: JWT_SECRET
        sync: false          # Generate a long random secret (min 32 chars)

      - key: DEVELOPER_EMAIL
        value: developer@triad.ae
      - key: DEVELOPER_PASSWORD
        sync: false          # Set a strong password in Render dashboard

      - key: OWNER_EMAIL
        value: owner@triad.ae
      - key: OWNER_PASSWORD
        sync: false          # Set a strong password in Render dashboard

      - key: STAFF_EMAIL
        value: normal@triad.ae
      - key: STAFF_PASSWORD
        sync: false

      # ── Database (optional — defaults to in-memory JSON file) ─────────────────
      - key: MONGO_URI
        sync: false          # Leave empty to use the built-in db_store.json

      # ── CORS — update with your actual Render URL after first deploy ──────────
      - key: CORS_ORIGINS
        value: https://webtriad-8.onrender.com
      - key: ALLOWED_HOSTS
        value: webtriad-8.onrender.com

      # ── Optional: external Reelly listings API ────────────────────────────────
      - key: REELLY_API_KEY
        sync: false

    # Health-check hits the /api/ root endpoint defined in server.py
    healthCheckPath: /api/
