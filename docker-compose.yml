version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: triad-app
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongodb:27017/triad_realty}
      DB_NAME: ${DB_NAME:-triad_realty}
      DEVELOPER_EMAIL: ${DEVELOPER_EMAIL:-developer@triad.ae}
      DEVELOPER_PASSWORD: ${DEVELOPER_PASSWORD:?Set DEVELOPER_PASSWORD in your local .env}
      OWNER_EMAIL: ${OWNER_EMAIL:-owner@triad.ae}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD in your local .env}
      STAFF_EMAIL: ${STAFF_EMAIL:-normal@triad.ae}
      STAFF_PASSWORD: ${STAFF_PASSWORD:?Set STAFF_PASSWORD in your local .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your local .env}
      UPLOADS_DIR: /app/uploaded_media
    volumes:
      - uploads_data:/app/uploaded_media
    depends_on:
      - mongodb
    restart: always

  mongodb:
    image: mongo:6.0
    container_name: triad-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:
  uploads_data:
